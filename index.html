<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1c1e" id="theme-color-meta" />
    <meta name="description" content="P2P Drop - 免安装、免注册、即开即用的浏览器端局域网 WebRTC 直连文件快传工具" />
    <link rel="manifest" href="./manifest.json" />
    <title>P2P Drop - 局域网直连快传</title>
    <script>
      (function() {
        try {
          var s = JSON.parse(localStorage.getItem('p2p_drop_settings') || '{}');
          var p = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (s.theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (s.theme === 'dark' || (!s.theme || s.theme === 'auto') && p) {
            document.documentElement.classList.add('dark');
          } else if (s.theme === 'auto' && !p) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#f5f5f7] text-[#1d1d1f] dark:bg-[#1c1c1e] dark:text-white/95 antialiased selection:bg-[#0a84ff] selection:text-white min-h-screen overflow-x-hidden font-sans transition-colors duration-200">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
